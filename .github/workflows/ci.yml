name: RP2350 Port CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile RP2350 firmware and UF2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install RP2040/RP2350 core
        run: |
          arduino-cli config init --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040@6.1.0
          # arduino-pico bundles the optional iLabs Hearth library, which targets
          # Challenger boards with an ESP32-C6 co-processor. TamaPoke runs on the
          # generic RP2350 and does not use Hearth; exclude it from discovery so
          # its board-specific compile-time checks cannot break this build.
          rm -rf "$HOME/.arduino15/packages/rp2040/hardware/rp2040/6.1.0/libraries/iLabs_Hearth"

      - name: Install graphics dependency
        run: arduino-cli lib install "Adafruit GFX Library"

      - name: Compile
        run: |
          rm -rf /tmp/TamaPoke
          mkdir -p /tmp/TamaPoke
          rsync -a --exclude='.git/' --exclude='build/' ./ /tmp/TamaPoke/
          mkdir -p build
          arduino-cli compile --warnings=all --fqbn "rp2040:rp2040:rpipico2" --output-dir "$GITHUB_WORKSPACE/build" /tmp/TamaPoke

      - name: Collect UF2
        run: |
          test -f build/*.uf2
          cp build/*.uf2 build/TamaPoke-RP2350-1.75.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: TamaPoke-RP2350-1.75
          retention-days: 30
          path: build/TamaPoke-RP2350-1.75.uf2

  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow
      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/sprites.py emit
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h species.h

  tools-lint:
    name: Lint tools/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the suite (plus AddressSanitizer + UBSan)
        run: ./test/run_tests.sh --asan

  i18n:
    name: i18n format-specifier consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_i18n_formats.py
